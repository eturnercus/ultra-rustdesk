name: Ultra RustDesk Build

# Builds Windows (x64), Linux (x86_64 + aarch64, deb + AppImage) and Android (apk)
# and publishes them to the "ultra-nightly" GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ultra-nightly' }}
      publish-update-metadata: false
